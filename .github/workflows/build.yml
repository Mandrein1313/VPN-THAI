name: Android Cloud Build Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    # สคริปต์แก้ไขปัญหา Java Code อัตโนมัติก่อน Build
    - name: Patch Legacy Java Code
      run: |
        echo "--> Fixing ok_dialog access modifier..."
        sed -i 's/private void ok_dialog/protected void ok_dialog/g' app/src/main/java/net/openvpn/openvpn/OpenVPNClient.java || true
        
        echo "--> Replacing switch-case with if-else in OpenVPNService.java..."
        sed -i 's/case R\.drawable\.connecting:/if (evm.icon_res_id == R.drawable.connecting) { \/\/ patched/g' app/src/main/java/net/openvpn/openvpn/OpenVPNService.java || true
        sed -i 's/case R\.drawable\.error:/} else if (evm.icon_res_id == R.drawable.error) { \/\/ patched/g' app/src/main/java/net/openvpn/openvpn/OpenVPNService.java || true

    - name: Clean & Build Debug APK
      run: gradle clean assembleDebug --no-daemon --build-cache

    - name: Generate Timestamp
      id: timestamp
      run: echo "timestamp=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

    - name: Upload APK to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "build-${{ steps.timestamp.outputs.timestamp }}"
        name: "Build ${{ steps.timestamp.outputs.timestamp }}"
        draft: false
        prerelease: false
        make_latest: true
        overwrite_files: true
        files: "**/build/outputs/apk/**/*.apk"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
